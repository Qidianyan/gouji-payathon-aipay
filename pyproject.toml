[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aipay-kit"
version = "0.2.0"
description = "PAYATHON 2026 S+: Alipay AI-Pay OpenAPI/SDK gateway, APASS 4-layer KYA attestation, Gouji real invoice 3-way reconciliation"
requires-python = ">=3.12"
dependencies = [
  "cryptography>=43",
  "fastapi>=0.115",
  "httpx>=0.27",
  "pillow>=10.0",
  "pypdf>=4.0",
  "python-multipart>=0.0.9",
  "uvicorn>=0.30",
]

[tool.setuptools]
packages = ["aipay_kit", "aipay_kit.gateway", "agentpay", "vibepay", "demo"]

[tool.pytest.ini_options]
testpaths = ["tests"]
